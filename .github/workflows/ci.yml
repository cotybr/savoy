name: CI — Lint, Testes e Scan de Segurança

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Permissões mínimas (princípio do menor privilégio)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: 🔒 Scan de Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Impede que .env ou segredos sejam commitados
      - name: Bloquear arquivos de ambiente
        run: |
          if git ls-files | grep -E '^\.env(\..*)?$' | grep -v '\.example$'; then
            echo "❌ Arquivo .env commitado. Remova do histórico."
            exit 1
          fi

      # Detecta segredos vazados com gitleaks
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verifica se os placeholders existem no index.html (sanidade)
      - name: Verificar placeholders obrigatórios
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_APP_PEPPER; do
            grep -q "%%${v}%%" index.html || { echo "❌ Placeholder $v ausente"; exit 1; }
          done

  build-dry-run:
    name: 🧪 Build Dry-Run (staging fake)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Simular build com valores dummy
        run: |
          export VITE_SUPABASE_URL="https://dummy.supabase.co"
          export VITE_SUPABASE_ANON_KEY="dummy_anon_key_for_build_test"
          export VITE_APP_PEPPER="dummy_pepper_64_chars_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export VITE_APP_ENV="ci"
          export VITE_APP_VERSION="0.0.0-ci"
          export VITE_MAX_INPUT_LENGTH="500"
          export VITE_RATE_LIMIT_TOKENS="10"
          export VITE_PDF_MAX_SIZE_MB="5"
          export VITE_PDF_MAX_PAGES="20"
          npm run build

      - name: Validar build
        run: npm run validate