jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6          # v4 → v6

      - run: |
          cat > config.js <<EOF
          window.APP_CONFIG = {
            SUPABASE_URL: "${{ secrets.SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}",
            PDF_URL: "./bancodehoras.pdf"
          };
          EOF

      - uses: actions/upload-pages-artifact@v5   # v3 → v5（内部已是 Node 24）
        with: { path: . }

      - uses: actions/deploy-pages@v5            # v4 → v5